<body>
<div id="app"></div>

<script>
/* =========================================================
数学大冒险 — 华小数学游戏 (Standard 1 & 3)
========================================================= */

/* ---------------- 工具函数 ---------------- */
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(arr) {
const a = arr.slice();
for (let i = a.length - 1; i > 0; i--) {
const j = Math.floor(Math.random() * (i + 1));
[a[i], a[j]] = [a[j], a[i]];
}
return a;
}
function numChoices(ans, n = 4, delta = 10) {
const set = new Set([ans]);
let guard = 0;
while (set.size < n && guard++ < 200) {
const d = rnd(1, delta);
const v = ans + (Math.random() < 0.5 ? -d : d);
if (v >= 0) set.add(v);
}
let v = ans + 1;
while (set.size < n) { set.add(v); v++; }
return shuffle([...set]);
}
function mixOptions(correct, pool, n = 4) {
const opts = [String(correct)];
for (const p of shuffle(pool.map(String))) {
if (opts.length >= n) break;
if (!opts.includes(p)) opts.push(p);
}
let guard = 0;
while (opts.length < n && guard++ < 60) {
const v = String(rnd(1, 99));
if (!opts.includes(v)) opts.push(v);
}
return shuffle(opts);
}
function decChoices(ansTenths, n = 4, delta = 15) {
const set = new Set([ansTenths]);
let guard = 0;
while (set.size < n && guard++ < 200) {
const d = rnd(1, delta);
const v = ansTenths + (Math.random() < 0.5 ? -d : d);
if (v > 0) set.add(v);
}
let v = ansTenths + 1;
while (set.size < n) { set.add(v); v++; }
return shuffle([...set]).map(x => (x / 10).toFixed(1));
}
const rm = c => 'RM' + (c / 100).toFixed(2);
function moneyChoices(ansCents, n = 4, delta = 250) {
const set = new Set([ansCents]);
let guard = 0;
while (set.size < n && guard++ < 200) {
const d = rnd(1, Math.max(1, Math.ceil(delta / 10))) * 10;
const v = ansCents + (Math.random() < 0.5 ? -d : d);
if (v > 0) set.add(v);
}
let v = ansCents + 10;
while (set.size < n) { set.add(v); v += 10; }
return shuffle([...set]).map(rm);
}
function cnNum(n) {
const d = ['零','一','二','三','四','五','六','七','八','九'];
if (n < 10) return d[n];
if (n === 10) return '十';
if (n < 20) return '十' + d[n % 10];
if (n < 100) {
const t = Math.floor(n / 10), o = n % 10;
return d[t] + '十' + (o ? d[o] : '');
}
return String(n);
}
function cnNumBig(n) {
const d = ['零','一','二','三','四','五','六','七','八','九'];
if (n < 10) return d[n];
if (n < 100) {
const t = Math.floor(n / 10), o = n % 10;
if (t === 1) return '十' + (o ? d[o] : '');
return d[t] + '十' + (o ? d[o] : '');
}
if (n < 1000) {
const h = Math.floor(n / 100), r = n % 100;
let s = d[h] + '百';
if (r === 0) return s;
if (r < 10) return s + '零' + d[r];
return s + cnNumBig(r);
}
const th = Math.floor(n / 1000), r = n % 1000;
let s = d[th] + '千';
if (r === 0) return s;
if (r < 100) return s + '零' + cnNumBig(r);
return s + cnNumBig(r);
}
function clockSVG(h, m) {
const cx = 100, cy = 100;
const hAng = ((h % 12) + m / 60) * 30 - 90;
const mAng = m * 6 - 90;
const hx = cx + 44 * Math.cos(hAng * Math.PI / 180);
const hy = cy + 44 * Math.sin(hAng * Math.PI / 180);
const mx = cx + 66 * Math.cos(mAng * Math.PI / 180);
const my = cy + 66 * Math.sin(mAng * Math.PI / 180);
let ticks = '';
for (let i = 0; i < 12; i++) {
const a = (i * 30 - 90) * Math.PI / 180;
const x1 = cx + 78 * Math.cos(a), y1 = cy + 78 * Math.sin(a);
const x2 = cx + 86 * Math.cos(a), y2 = cy + 86 * Math.sin(a);
ticks += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#4a2fbd" stroke-width="4" stroke-linecap="round"/>`;
}
return `<svg viewBox="0 0 200 200" class="clock">
<circle cx="100" cy="100" r="94" fill="#fff" stroke="#4a2fbd" stroke-width="8"/>
${ticks}
<line x1="100" y1="100" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" stroke="#1b1464" stroke-width="9" stroke-linecap="round"/>
<line x1="100" y1="100" x2="${mx.toFixed(1)}" y2="${my.toFixed(1)}" stroke="#ff5c8a" stroke-width="6" stroke-linecap="round"/>
<circle cx="100" cy="100" r="8" fill="#1b1464"/>
</svg>`;
}

/* =========================================================
一年级 题目生成器
========================================================= */
const EMOJIS = ['🍎','⭐','🐟','🌸','🚗','🐝','🍩','⚽','🐰','🍇','🎈','🐢'];

function gen1Num() {
const t = pick(['count','count','seq','compare','word']);
if (t === 'count') {
const n = rnd(6, 20);
const e = pick(EMOJIS);
let vis = '';
for (let i = 0; i < n; i++) vis += e;
return {
q: `数一数，一共有几个 ${e} ？`,
visual: `<div class="emoji-grid">${vis}</div>`,
options: numChoices(n, 4, 4).map(String),
answer: String(n),
hint: '一个一个慢慢数，不要跳哦～'
};
}
if (t === 'seq') {
const start = rnd(1, 70);
const hide = pick([1, 2]);
const arr = [start, start + 1, start + 2, start + 3];
const ans = arr[hide];
const disp = arr.map((v, i) => i === hide ? '<span class="blank">?</span>' : v).join(' → ');
return {
q: '按顺序填一填，问号是几？',
visual: `<div class="seq">${disp}</div>`,
options: numChoices(ans, 4, 3).map(String),
answer: String(ans),
hint: '后面的数比前面多 1。'
};
}
if (t === 'compare') {
const pool = [];
while (pool.length < 3) { const v = rnd(1, 100); if (!pool.includes(v)) pool.push(v); }
const max = Math.max(...pool);
return {
q: '下面哪个数最大？',
options: pool.map(String),
answer: String(max),
hint: '先比十位，十位大的数就大。'
};
}
const n = rnd(11, 99);
return {
q: `“${cnNum(n)}”是下面哪个数字？`,
options: numChoices(n, 4, 9).map(String),
answer: String(n),
hint: '十位读作「几」十，个位读作「几」。'
};
}

function gen1AddSub() {
const t = pick(['add','add','sub','sub','wordadd','wordsub']);
if (t === 'add') {
const a = rnd(5, 50);
const b = rnd(2, Math.min(48, 99 - a));
const ans = a + b;
return { q: `${a} + ${b} = ?`, options: numChoices(ans, 4, 8).map(String), answer: String(ans), hint: '先加个位，再加十位。' };
}
if (t === 'sub') {
const a = rnd(20, 99);
const b = rnd(2, a - 5);
const ans = a - b;
return { q: `${a} − ${b} = ?`, options: numChoices(ans, 4, 8).map(String), answer: String(ans), hint: '先减个位，不够就向十位借 1。' };
}
if (t === 'wordadd') {
const a = rnd(10, 60);
const b = rnd(5, Math.max(6, 99 - a));
const ans = a + b;
return {
q: `小明有 ${a} 颗糖果，妈妈又给了他 ${b} 颗。现在他一共有多少颗糖果？`,
options: numChoices(ans, 4, 8).map(String), answer: String(ans),
hint: '「又给了他」表示变多了，用加法。'
};
}
const a = rnd(20, 99);
const b = rnd(5, a - 5);
const ans = a - b;
return {
q: `树上原来有 ${a} 只小鸟，飞走了 ${b} 只。树上还剩多少只小鸟？`,
options: numChoices(ans, 4, 8).map(String), answer: String(ans),
hint: '「飞走了」表示变少了，用减法。'
};
}

function gen1Mul() {
const tables = [2, 3, 4, 5, 10];
const a = pick(tables);
const b = rnd(1, 9);
const ans = a * b;
const t = pick(['mul','mul','repeat','word']);
if (t === 'mul') {
return { q: `${a} × ${b} = ?`, options: numChoices(ans, 4, 6).map(String), answer: String(ans), hint: `想一想 ${a} 的乘法口诀。` };
}
if (t === 'repeat') {
const parts = Array(b).fill(a).join(' + ');
const correct = `${a} × ${b}`;
const pool = [`${a} × ${a}`, `${b} × ${b}`, `${a} + ${b}`, `${b} × ${a}`];
return {
q: `${parts} 可以写成下面哪一个乘法算式？`,
visual: `<div class="seq">${parts}</div>`,
options: mixOptions(correct, pool, 4),
answer: correct,
hint: `有 ${b} 个 ${a} 相加，就是 ${a} × ${b}。`
};

while (n2 === n1 && guard++ < 30) n2 = rnd(1, den - 1);

const a = `${n1}/${den}`, b = `${n2}/${den}`;

return {

}
if (t === 'change') {

return {

}
if (t === 'mul') {

const per = rnd(200, 1500);

}

function timeFmt(totalMin) {
let h = Math.floor(totalMin / 60) % 12;
if (h === 0) h = 12;
const m = totalMin % 60;
return `${h}:${String(m).padStart(2, '0')}`;
}
function timeChoices(totalMin, n = 4) {
const set = new Set([timeFmt(totalMin)]);
let guard = 0;
while (set.size < n && guard++ < 120) {
const d = pick([5, 10, 15, 20, 30]);
const v = totalMin + (Math.random() < 0.5 ? -d : d);
if (v > 0) set.add(timeFmt(v));
}
let v = totalMin + 60;
while (set.size < n) { set.add(timeFmt(v)); v += 60; }
return shuffle([...set]);
}
function gen3Time() {
const t = pick(['convert','convert','add','dur']);
if (t === 'convert') {
const h = rnd(1, 5), m = pick([0, 15, 30, 45]);
const total = h * 60 + m;
return {
q: `${h} 小时${m ? ' ' + m + ' 分钟' : ''} = ? 分钟`,
options: numChoices(total, 4, 30).map(String),
answer: String(total),
hint: '1 小时 = 60 分钟。'
};
}
if (t === 'add') {
const h = rnd(1, 11);
const m = pick([5, 10, 15, 20, 25, 30, 35, 40, 45, 50]);
const add = pick([10, 15, 20, 25, 30, 40, 45, 50]);
const total = h * 60 + m + add;
return {
q: `${timeFmt(h * 60 + m)} 再过 ${add} 分钟是几点？`,
options: timeChoices(total, 4),
answer: timeFmt(total),
hint: '分钟加分钟，满 60 分钟就进 1 小时。'
};
}
const startH = rnd(1, 10), startM = pick([0, 15, 30, 45]);
const dur = pick([30, 45, 60, 75, 90, 120]);
const total = startH * 60 + startM + dur;
return {
q: `从 ${timeFmt(startH * 60 + startM)} 到 ${timeFmt(total)}，经过了多长时间？`,
options: shuffle([`${dur} 分钟`, `${dur + 15} 分钟`, `${Math.max(10, dur - 15)} 分钟`, `${dur + 30} 分钟`]),
answer: `${dur} 分钟`,
hint: '结束时间 − 开始时间 = 经过的时间。'
};
}

function gen3Data() {

]);

const rows = fruits.map(f =>
`<div class="picto-row"><span class="picto-label">${f.name}</span><span class="picto-icons">${f.e.repeat(f.n)}</span></div>`
).join('');
const note = scale === 2 ? `<div class="picto-note">每个图案代表 2 个</div>` : '';
const t = pick(['count','most','least','total']);
if (t === 'count') {

return {

if (t === 'total') {

return {

options: numChoices(ans, 4, Math.max(3, scale * 3)).map(String),

};
}
const sorted = fruits.slice().sort((a, b) => b.n - a.n);
const askMost = t === 'most';
const ans = askMost ? sorted[0].name : sorted[sorted.length - 1].name;
return {
q: askMost ? '哪一种水果最多？' : '哪一种水果最少？',
visual: `<div class="picto">${rows}${note}</div>`,
options: shuffle(fruits.map(f => f.name)),

hint: '比较每一行的图案数量。'
};
}

let actx = null;
function ensureAudio() {
if (!actx) {
try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
}
if (actx && actx.state === 'suspended') actx.resume();
}
function tone(freq, start, dur, type = 'sine', vol = 0.13) {
if (!actx) return;
try {
const o = actx.createOscillator(), g = actx.createGain();
o.type = type;
o.frequency.value = freq;
const t0 = actx.currentTime + start;
g.gain.setValueAtTime(0.0001, t0);
g.gain.linearRampToValueAtTime(vol, t0 + 0.012);
g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
o.connect(g); g.connect(actx.destination);
o.start(t0); o.stop(t0 + dur + 0.03);
} catch (e) {}
}
function playCorrect() { ensureAudio(); tone(523, 0, .12); tone(659, .1, .12); tone(784, .2, .22); }
function playWrong() { ensureAudio(); tone(220, 0, .16, 'square', .09); tone(165, .13, .26, 'square', .09); }
function playClick() { ensureAudio(); tone(620, 0, .06, 'sine', .07); }
function playWin() { ensureAudio(); [523, 659, 784, 1046].forEach((f, i) => tone(f, i * 0.12, .28)); }

const TOTAL_Q = 10;

function buildQ(o) {
let opts = [...new Set(o.options.map(String))];
const ans = String(o.answer);
if (!opts.includes(ans)) opts.push(ans);
let guard = 0;
while (opts.length < 4 && guard++ < 40) {
const v = String(rnd(1, 99));
if (!opts.includes(v)) opts.push(v);
}
return {
q: o.q,
visual: o.visual || '',
hint: o.hint || '',
answer: ans,
options: shuffle(opts)
};
}

function render() {
if (state.screen === 'home') renderHome();

/* ---------- 开始游戏 ---------- */
function startGame(topic) {
state.topic = topic;
state.questions = [];
for (let i = 0; i < TOTAL_Q; i++) {
let q = null, guard = 0;
while (!q && guard++ < 12) {
try { q = buildQ(topic.gen()); } catch (e) { q = null; }
}
if (!q) {
q = buildQ({
q: '1 + 1 = ?', options: ['1', '2', '3', '4'], answer: '2', hint: '很简单吧！'
});
}
state.questions.push(q);
}
state.idx = 0;
state.score = 0;
state.streak = 0;
state.correctCount = 0;
state.answered = false;
state.screen = 'play';
render();
}

function handleAnswer(opt, btn) {
if (state.answered) return;
state.answered = true;

const q = state.questions[state.idx];
const isRight = String(opt) === String(q.answer);
const buttons = [...document.querySelectorAll('.opt')];
buttons.forEach(b => b.classList.add('disabled'));
const correctBtn = buttons.find(b => b.dataset.opt === String(q.answer));

if (isRight) {
btn.classList.add('correct');
state.correctCount++;
state.streak++;
const gain = 10 + Math.min(state.streak - 1, 5) * 2;
state.score += gain;
const badge = document.getElementById('scoreBadge');
if (badge) badge.textContent = '⭐ ' + state.score;

playCorrect();
burstConfetti(btn);

const praise = ['太棒了！', '答对了！', '好厉害！', '真聪明！', '继续加油！', '好样的！'];

if (state.streak >= 3) msg += ` 连对 ${state.streak} 题！🔥`;
showToast(msg);

setTimeout(nextQuestion, 1050);
} else {
btn.classList.add('wrong');

const area = document.getElementById('qarea');

area.appendChild(cont);
}
}

}

/* ---------- 特效 ---------- */
function burstConfetti(el) {
const rect = el.getBoundingClientRect();
const colors = ['#ffd166', '#ff5c8a', '#4cc9f0', '#b5e48c', '#f72585', '#7209b7', '#fff'];
for (let i = 0; i < 18; i++) {
const p = document.createElement('div');
p.className = 'confetti';
p.style.left = (rect.left + rect.width / 2) + 'px';
p.style.top = (rect.top + rect.height / 2) + 'px';
p.style.background = pick(colors);
const ang = Math.random() * Math.PI * 2;
const dist = 60 + Math.random() * 130;
p.style.setProperty('--tx', (Math.cos(ang) * dist).toFixed(0) + 'px');
p.style.setProperty('--ty', (Math.sin(ang) * dist + 90).toFixed(0) + 'px');
p.style.setProperty('--rot', (Math.random() * 720 - 360).toFixed(0) + 'deg');
document.body.appendChild(p);
setTimeout(() => p.remove(), 1000);
}
}
function showToast(msg) {
const t = document.createElement('div');
t.className = 'toast';
